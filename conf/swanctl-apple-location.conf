# apple-location IKEv2 VPN - personal single-user
connections {
    apple-location {
        version = 2
        proposals = aes256-sha256-modp2048
        pools = vpn_pool
        # Keep IKE_AUTH unfragmented for iOS cellular networks that mishandle
        # RFC 7383 fragments.
        fragmentation = no
        local {
            auth = pubkey
            certs = server-cert.pem
            # Replace this documentation IP with VPN_SERVER_ADDRESS.
            id = 203.0.113.10
        }
        remote {
            auth = pubkey
            # Explicitly trust the CA used to issue the client certificate.
            cacerts = ca.crt
            id = apple-location-client
        }
        children {
            net {
                local_ts = 0.0.0.0/0
                esp_proposals = aes256-sha256
                dpd_action = clear
            }
        }
    }
}

pools {
    vpn_pool {
        # .1 is reserved for the server (DNS + fake location API).
        addrs = 10.8.1.2-10.8.1.254
        dns = 10.8.1.1
    }
}

secrets {
    private-server {
        file = server-key.pem
    }
}
